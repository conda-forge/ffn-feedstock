schema_version: 1

context:
  name: ffn
  version: "1.4.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 470c02fcd8be8a148b8033e9b80fb10ddd8e2102b18b94135c04492e6319779a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - decorator >=5.0.7
    - matplotlib-base >=1
    - numpy >=1.5
    - pandas >=0.19
    - scikit-learn >=0.15
    - scipy >=0.15
    - tabulate >=0.7.5
    - yfinance >=0.2

tests:
  - python:
      imports:
        - ffn
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: ffn - a financial function library for Python
  description: ffn - a financial function library for Python
  homepage: https://github.com/pmorissette/ffn
  repository: https://github.com/pmorissette/ffn
  documentation: http://pmorissette.github.io/ffn/

extra:
  recipe-maintainers:
    - timkpaine
